<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">SIX REASONS WHY GENERATIVE AI PILOTS FAIL TO SCALE</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Why 70% of Enterprise GenAI Initiatives Never Reach Production Deployment</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">FAILURE 01</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Unvalidated Training Data</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Training AI models on duplicate</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">or unmonitored records causes</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">severe hallucinations and</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">untrustworthy predictions.</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(253, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">FAILURE 02</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Absent Data Ownership</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">No business domain owners exist</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">to authorize access, validate</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">business logic, or approve RAG</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">knowledge stores.</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(486, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">FAILURE 03</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Unrealistic ROI Timelines</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">C-suite pressure to show fast</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">AI value forces teams to skip</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">foundational data prep and</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">quality guardrails.</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(20, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">FAILURE 04</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Compliance Risks</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Feeding unmasked PII or trade</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">secrets into public AI models</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">triggers legal exposure and</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">regulatory penalties.</text>
  </g>

  <!-- CARD 05 -->
  <g transform="translate(253, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#ec4899"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#db2777" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="0.5">FAILURE 05</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Black-Box Outputs</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Lack of automated data lineage</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">makes it impossible to trace,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">audit, or explain AI decisions to</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">regulators and users.</text>
  </g>

  <!-- CARD 06 -->
  <g transform="translate(486, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#475569" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">FAILURE 06</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Low Human Data Literacy</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Workforce teams lack training on</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">prompt engineering ethics, data</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">privacy, and critically evaluating</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">AI-generated results.</text>
  </g>
</svg>
