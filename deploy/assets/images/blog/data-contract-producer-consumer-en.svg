<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">A data contract between a producer and a consumer domain</title>
  <desc id="desc">Two domains in sequence. The producer domain, for example Sales Engineering, defines the schema, maintains the ingestion pipeline and commits to the data contract SLA. Through the data contract and SLA agreement, the consumer domain, for example Financial Analytics, consumes a certified data product with guaranteed quality and freshness.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">DATA CONTRACTS: FROM PRODUCER TO CONSUMER</text>
  
  <!-- e.g., Sales Engineering -->
  <rect x="24" y="48" width="672" height="87" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="4" height="87" fill="#071c2c"/>
  <text x="48" y="74" font-size="10" font-weight="700" fill="#071c2c" letter-spacing="1.4">PRODUCER DOMAIN</text>
  <text x="48" y="98" font-size="17" font-weight="600" fill="#071c2c">e.g., Sales Engineering</text>
  <text x="48" y="120" font-size="12.5" fill="#31505c">Defines schema, maintains ingestion pipeline, and commits to Data Contract SLA.</text>
  <line x1="360" y1="137" x2="360" y2="181" stroke="#31505c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Handoff: DATA CONTRACT & SLA AGREEMENT -->
  <rect x="374" y="148" width="277.90855" height="22" rx="11" fill="#ffffff" stroke="#0a7568"/>
  <text x="512.954275" y="162.5" font-size="10" font-weight="700" fill="#0a7568" letter-spacing="1.2" text-anchor="middle">DATA CONTRACT &amp; SLA AGREEMENT</text>
  <!-- e.g., Financial Analytics -->
  <rect x="24" y="183" width="672" height="87" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="183" width="4" height="87" fill="#0a7568"/>
  <text x="48" y="209" font-size="10" font-weight="700" fill="#0a7568" letter-spacing="1.4">CONSUMER DOMAIN</text>
  <text x="48" y="233" font-size="17" font-weight="600" fill="#071c2c">e.g., Financial Analytics</text>
  <text x="48" y="255" font-size="12.5" fill="#31505c">Consumes certified data product with guaranteed quality and freshness SLAs.</text>
</svg>
