<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Main Header Title -->
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">SIX SYMPTOMS OF DATA TYRANNY IN THE ENTERPRISE</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">How Excessive Restrictiveness Undermines Enterprise Decision-Making</text>

  <!-- GRID ROW 1 -->
  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">SYMPTOM 01</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Endless Approval Loops</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Basic data access requires multi-tier</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">sign-offs from IT and legal teams,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">delaying routine decision-making</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">by weeks.</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(253, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">SYMPTOM 02</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Data Black Markets</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Frustrated teams manually export</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">raw CSVs into desktop spreadsheets,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">creating ungoverned shadow</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">reporting silos.</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(486, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">SYMPTOM 03</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Single Point of Failure</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">A single centralized engineering</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">team owns all pipeline changes,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">creating a massive backlog for</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">every business department.</text>
  </g>

  <!-- GRID ROW 2 -->
  <!-- CARD 04 -->
  <g transform="translate(20, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">SYMPTOM 04</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Zero Self-Service</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Business users cannot discover</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">datasets or understand field</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">definitions without submitting a</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">formal IT support ticket.</text>
  </g>

  <!-- CARD 05 -->
  <g transform="translate(253, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#ec4899"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#db2777" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="0.5">SYMPTOM 05</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Stifled Innovation</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Exploratory analytics and ad-hoc</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">testing are discouraged due to</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">punitive security policies that</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">treat all data as Tier 1 risk.</text>
  </g>

  <!-- CARD 06 -->
  <g transform="translate(486, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#475569" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">SYMPTOM 06</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Distrust in Governance</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Employees view governance as</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">restrictive red tape rather than an</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">enabler of operational speed,</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">quality, and growth.</text>
  </g>
</svg>
