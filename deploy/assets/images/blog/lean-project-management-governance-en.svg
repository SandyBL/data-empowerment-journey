<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">LEAN + PROJECT MANAGEMENT IN DATA GOVERNANCE</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Combining Waste Elimination with Structured Execution for Maximum ROI</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">LEAN FOCUS</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Value Stream Mapping</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Map data flows from source to</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">dashboard to uncover manual</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">handoffs, redundant checks, and</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">approval bottlenecks.</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(253, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">LEAN FOCUS</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Digital Waste Cut</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Eliminate manual spreadsheet</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">reconciliations, duplicate copies,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">and unused metrics that add</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">no business value.</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(486, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">LEAN FOCUS</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Kaizen Mindset</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Treat governance as an evolving,</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">iterative discipline built on</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">continuous small improvements</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">rather than rigid mandates.</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(20, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">PM FOCUS</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Objective Setting</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Translate abstract governance</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">mandates into clear, measurable</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">KPIs, project milestones, and</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">quality SLAs.</text>
  </g>

  <!-- CARD 05 -->
  <g transform="translate(253, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#ec4899"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#db2777" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="0.5">PM FOCUS</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Resource Optimization</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Allocate engineering time,</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">software budgets, and data</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">stewardship hours to high-priority</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">data domains.</text>
  </g>

  <!-- CARD 06 -->
  <g transform="translate(486, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#475569" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">PM FOCUS</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Accountability Mapping</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Establish explicit Data Owner</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">and Steward responsibilities so</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">tasks never stall or fall through</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">the cracks.</text>
  </g>
</svg>
