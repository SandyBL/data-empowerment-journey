<svg xmlns="http://www.w3.org/2000/svg" width="720" height="449" viewBox="0 0 720 449" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Los seis pilares de un programa de gobierno de datos</title>
  <desc id="desc">Seis componentes que un programa de gobierno necesita a la vez — estrategia y alcance, roles y responsabilidad, políticas y estándares, procesos y flujo de trabajo, metadatos y catálogo, y las métricas que demuestran que funciona.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">LOS SEIS PILARES DE UN PROGRAMA DE GOBIERNO</text>
  
  <!-- Estrategia y alcance -->
  <rect x="24" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="72" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">PILAR 01</text>
  <text x="44" y="93" font-size="15" font-weight="600" fill="#071c2c">Estrategia y alcance</text>
  <text x="44" y="113" font-size="11.8" fill="#31505c">Dos o tres resultados de negocio de los que el</text>
  <text x="44" y="129" font-size="11.8" fill="#31505c">gobierno responde, y todo lo que</text>
  <text x="44" y="145" font-size="11.8" fill="#31505c">explícitamente aún no hace.</text>
  <!-- Roles y responsabilidad -->
  <rect x="370" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="48" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="72" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">PILAR 02</text>
  <text x="390" y="93" font-size="15" font-weight="600" fill="#071c2c">Roles y responsabilidad</text>
  <text x="390" y="113" font-size="11.8" fill="#31505c">Propietarios y stewards con nombre por</text>
  <text x="390" y="129" font-size="11.8" fill="#31505c">dominio, con los derechos de decisión que de</text>
  <text x="390" y="145" font-size="11.8" fill="#31505c">verdad tienen.</text>
  <!-- Políticas y estándares -->
  <rect x="24" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="181" width="4" height="113" fill="#095b73"/>
  <text x="44" y="205" font-size="9.5" font-weight="700" fill="#095b73" letter-spacing="1.3">PILAR 03</text>
  <text x="44" y="226" font-size="15" font-weight="600" fill="#071c2c">Políticas y estándares</text>
  <text x="44" y="246" font-size="11.8" fill="#31505c">Reglas cortas que la gente pueda seguir,</text>
  <text x="44" y="262" font-size="11.8" fill="#31505c">escritas donde ocurre el trabajo y no en una</text>
  <text x="44" y="278" font-size="11.8" fill="#31505c">carpeta.</text>
  <!-- Procesos y flujo -->
  <rect x="370" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="181" width="4" height="113" fill="#ec6d57"/>
  <text x="390" y="205" font-size="9.5" font-weight="700" fill="#ec6d57" letter-spacing="1.3">PILAR 04</text>
  <text x="390" y="226" font-size="15" font-weight="600" fill="#071c2c">Procesos y flujo</text>
  <text x="390" y="246" font-size="11.8" fill="#31505c">Cómo se aprueba una definición, se cambia</text>
  <text x="390" y="262" font-size="11.8" fill="#31505c">una regla y se concede una excepción.</text>
  <!-- Metadatos y catálogo -->
  <rect x="24" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="314" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="338" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">PILAR 05</text>
  <text x="44" y="359" font-size="15" font-weight="600" fill="#071c2c">Metadatos y catálogo</text>
  <text x="44" y="379" font-size="11.8" fill="#31505c">Un único sitio para consultar qué significa un</text>
  <text x="44" y="395" font-size="11.8" fill="#31505c">campo, de dónde viene y a quién preguntar.</text>
  <!-- Métricas e informes -->
  <rect x="370" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="314" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="338" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">PILAR 06</text>
  <text x="390" y="359" font-size="15" font-weight="600" fill="#071c2c">Métricas e informes</text>
  <text x="390" y="379" font-size="11.8" fill="#31505c">Unas pocas medidas que muestren que los</text>
  <text x="390" y="395" font-size="11.8" fill="#31505c">resultados se movieron, con la cadencia del</text>
  <text x="390" y="411" font-size="11.8" fill="#31505c">negocio.</text>
</svg>
