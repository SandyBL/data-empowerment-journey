<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">LEAN + GESTÃO DE PROJETOS NA GOVERNANÇA DE DADOS</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Eliminação de Desperdícios e Execução Estruturada para Aumentar o ROI</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">FOCO LEAN</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Fluxo de Valor</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Mapeie o caminho do dado desde</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">a origem até os relatórios para</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">identificar tarefas manuais e</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">gargalos operacionais.</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(253, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">FOCO LEAN</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Corte de Desperdício</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Elimine conciliações manuais,</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">planilhas paralelas duplicadas</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">e relatórios sem uso que não</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">geram valor real.</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(486, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">FOCO LEAN</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Cultura Kaizen</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Trate a governança como uma</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">disciplina iterativa baseada em</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">pequenas melhorias contínuas e</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">não em projetos estáticos.</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(20, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">FOCO GP</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Metas Claras</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Traduza diretrizes gerais de</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">governança em KPIs mensuráveis,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">marcos de projetos e SLAs de</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">qualidade de dados.</text>
  </g>

  <!-- CARD 05 -->
  <g transform="translate(253, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#ec4899"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#db2777" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="0.5">FOCO GP</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Gestão de Recursos</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Direcione horas de engenharia,</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">orçamento de software e tempo</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">dos Data Stewards para os</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">domínios prioritários.</text>
  </g>

  <!-- CARD 06 -->
  <g transform="translate(486, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#475569" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">FOCO GP</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Papéis Definidos</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Estabeleça funções claras para</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">Data Owners e Stewards, evitando</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">que tarefas essenciais fiquem</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">paralisadas por falta de dono.</text>
  </g>
</svg>
