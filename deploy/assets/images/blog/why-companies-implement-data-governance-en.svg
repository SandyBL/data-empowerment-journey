<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">THE THREE DRIVERS OF DATA GOVERNANCE IMPLEMENTATION</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">From Crisis Firefighting (Reactive) to Business Value Creation (Strategic)</text>

  <!-- COLUMN 1: REACTIVE -->
  <g transform="translate(20, 75)">
    <rect width="213" height="320" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="6" rx="3" fill="#ef4444"/>
    <rect x="12" y="16" width="90" height="20" rx="3" fill="#dc2626" fill-opacity="0.25"/>
    <text x="57" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="#fca5a5" letter-spacing="0.5">REACTIVE MODE</text>
    <text x="12" y="58" font-size="15" font-weight="700" fill="#f8fafc">Crisis Response</text>
    
    <line x1="12" y1="70" x2="201" y2="70" stroke="#334155" stroke-width="1"/>
    
    <text x="12" y="90" font-size="11" font-weight="700" fill="#38bdf8">Primary Trigger:</text>
    <text x="12" y="106" font-size="11" font-weight="400" fill="#94a3b8">• Post-breach remediation</text>
    <text x="12" y="122" font-size="11" font-weight="400" fill="#94a3b8">• Regulatory audit penalties</text>
    <text x="12" y="138" font-size="11" font-weight="400" fill="#94a3b8">• Major operational outages</text>
    
    <text x="12" y="168" font-size="11" font-weight="700" fill="#38bdf8">Operational Focus:</text>
    <text x="12" y="184" font-size="11" font-weight="400" fill="#94a3b8">• Emergency security patches</text>
    <text x="12" y="200" font-size="11" font-weight="400" fill="#94a3b8">• Mandatory compliance logging</text>
    <text x="12" y="216" font-size="11" font-weight="400" fill="#94a3b8">• Isolated data cleanup</text>

    <text x="12" y="246" font-size="11" font-weight="700" fill="#38bdf8">Business ROI:</text>
    <text x="12" y="262" font-size="11" font-weight="400" fill="#94a3b8">• High cost center / Overhead</text>
    <text x="12" y="278" font-size="11" font-weight="400" fill="#94a3b8">• Low user adoption</text>
    <text x="12" y="294" font-size="11" font-weight="400" fill="#94a3b8">• Damage control focus</text>
  </g>

  <!-- COLUMN 2: PREEMPTIVE -->
  <g transform="translate(253, 75)">
    <rect width="213" height="320" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="6" rx="3" fill="#f59e0b"/>
    <rect x="12" y="16" width="105" height="20" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="64" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">PREEMPTIVE MODE</text>
    <text x="12" y="58" font-size="15" font-weight="700" fill="#f8fafc">Risk Mitigation</text>

    <line x1="12" y1="70" x2="201" y2="70" stroke="#334155" stroke-width="1"/>

    <text x="12" y="90" font-size="11" font-weight="700" fill="#38bdf8">Primary Trigger:</text>
    <text x="12" y="106" font-size="11" font-weight="400" fill="#94a3b8">• Upcoming privacy laws</text>
    <text x="12" y="122" font-size="11" font-weight="400" fill="#94a3b8">• Corporate M&amp;A integration</text>
    <text x="12" y="138" font-size="11" font-weight="400" fill="#94a3b8">• Cloud migration projects</text>

    <text x="12" y="168" font-size="11" font-weight="700" fill="#38bdf8">Operational Focus:</text>
    <text x="12" y="184" font-size="11" font-weight="400" fill="#94a3b8">• Data classification &amp; MDM</text>
    <text x="12" y="200" font-size="11" font-weight="400" fill="#94a3b8">• Standardized data models</text>
    <text x="12" y="216" font-size="11" font-weight="400" fill="#94a3b8">• Preemptive audit controls</text>

    <text x="12" y="246" font-size="11" font-weight="700" fill="#38bdf8">Business ROI:</text>
    <text x="12" y="262" font-size="11" font-weight="400" fill="#94a3b8">• Avoided regulatory fines</text>
    <text x="12" y="278" font-size="11" font-weight="400" fill="#94a3b8">• Smooth system migrations</text>
    <text x="12" y="294" font-size="11" font-weight="400" fill="#94a3b8">• Risk mitigation value</text>
  </g>

  <!-- COLUMN 3: STRATEGIC -->
  <g transform="translate(486, 75)">
    <rect width="213" height="320" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="6" rx="3" fill="#22c55e"/>
    <rect x="12" y="16" width="95" height="20" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="59" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">STRATEGIC MODE</text>
    <text x="12" y="58" font-size="15" font-weight="700" fill="#f8fafc">Value Enabler</text>

    <line x1="12" y1="70" x2="201" y2="70" stroke="#334155" stroke-width="1"/>

    <text x="12" y="90" font-size="11" font-weight="700" fill="#38bdf8">Primary Trigger:</text>
    <text x="12" y="106" font-size="11" font-weight="400" fill="#94a3b8">• Revenue growth goals</text>
    <text x="12" y="122" font-size="11" font-weight="400" fill="#94a3b8">• Self-service analytics push</text>
    <text x="12" y="138" font-size="11" font-weight="400" fill="#94a3b8">• AI/ML platform scaling</text>

    <text x="12" y="168" font-size="11" font-weight="700" fill="#38bdf8">Operational Focus:</text>
    <text x="12" y="184" font-size="11" font-weight="400" fill="#94a3b8">• Certified Data Catalog</text>
    <text x="12" y="200" font-size="11" font-weight="400" fill="#94a3b8">• Domain Data Ownership</text>
    <text x="12" y="216" font-size="11" font-weight="400" fill="#94a3b8">• Automated Data Quality</text>

    <text x="12" y="246" font-size="11" font-weight="700" fill="#38bdf8">Business ROI:</text>
    <text x="12" y="262" font-size="11" font-weight="400" fill="#94a3b8">• Faster executive decisions</text>
    <text x="12" y="278" font-size="11" font-weight="400" fill="#94a3b8">• Reduced operational waste</text>
    <text x="12" y="294" font-size="11" font-weight="400" fill="#94a3b8">• Sustainable competitive edge</text>
  </g>
</svg>
