<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Personas, procesos, tecnología y datos, y cómo falla cada uno por separado</title>
  <desc id="desc">Los cuatro pilares del gobierno de datos — personas, procesos, tecnología y datos — cada uno con lo que aporta y la forma concreta en que un programa fracasa cuando ese pilar falta.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">LAS CUATRO COSAS QUE EL GOBIERNO DEBE ACERTAR</text>
  
  <!-- Personas -->
  <rect x="24" y="48" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="326" height="4" fill="#071c2c"/>
  <text x="44" y="76" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">SIN ELLAS: NADIE DECIDE</text>
  <text x="44" y="98" font-size="16" font-weight="600" fill="#071c2c">Personas</text>
  <text x="44" y="118" font-size="11.8" fill="#31505c">Propietarios y stewards con nombre y</text>
  <text x="44" y="134" font-size="11.8" fill="#31505c">derechos de decisión reales. Sin esto, cada</text>
  <text x="44" y="150" font-size="11.8" fill="#31505c">definición queda abierta porque nadie tiene el</text>
  <text x="44" y="166" font-size="11.8" fill="#31505c">trabajo de cerrarla.</text>
  <!-- Procesos -->
  <rect x="370" y="48" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="48" width="326" height="4" fill="#0a7568"/>
  <text x="390" y="76" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">SIN ELLOS: TODO CASO ES NUEVO</text>
  <text x="390" y="98" font-size="16" font-weight="600" fill="#071c2c">Procesos</text>
  <text x="390" y="118" font-size="11.8" fill="#31505c">El camino repetible de una pregunta a una</text>
  <text x="390" y="134" font-size="11.8" fill="#31505c">respuesta aprobada. Sin esto, cada definición</text>
  <text x="390" y="150" font-size="11.8" fill="#31505c">se vuelve a discutir desde cero en otra</text>
  <text x="390" y="166" font-size="11.8" fill="#31505c">reunión.</text>
  <!-- Tecnología -->
  <rect x="24" y="212" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="212" width="326" height="4" fill="#095b73"/>
  <text x="44" y="240" font-size="9.5" font-weight="700" fill="#095b73" letter-spacing="1.3">SIN ELLA: NADA ESCALA</text>
  <text x="44" y="262" font-size="16" font-weight="600" fill="#071c2c">Tecnología</text>
  <text x="44" y="282" font-size="11.8" fill="#31505c">El catálogo, el linaje, los controles</text>
  <text x="44" y="298" font-size="11.8" fill="#31505c">automáticos. Sin esto, las reglas viven en una</text>
  <text x="44" y="314" font-size="11.8" fill="#31505c">hoja de cálculo que solo mantiene su autor.</text>
  <!-- Datos -->
  <rect x="370" y="212" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="212" width="326" height="4" fill="#ec6d57"/>
  <text x="390" y="240" font-size="9.5" font-weight="700" fill="#ec6d57" letter-spacing="1.3">SIN ELLOS: TODO ES TEORÍA</text>
  <text x="390" y="262" font-size="16" font-weight="600" fill="#071c2c">Datos</text>
  <text x="390" y="282" font-size="11.8" fill="#31505c">Las definiciones, reglas de calidad y</text>
  <text x="390" y="298" font-size="11.8" fill="#31505c">clasificaciones reales. Sin esto, tienes un</text>
  <text x="390" y="314" font-size="11.8" fill="#31505c">marco de gobierno que no gobierna nada.</text>
</svg>
