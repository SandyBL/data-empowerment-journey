<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Data literacy crossed with data governance maturity</title>
  <desc id="desc">A two-by-two of data literacy against governance maturity: confident and wrong, genuinely data-driven, running on gut feel, and governed but unused.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">LITERACY AND GOVERNANCE: FOUR PLACES TO BE</text>
  
  <!-- Confident and wrong -->
  <rect x="78" y="48" width="299" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="78" y="48" width="299" height="4" fill="#071c2c"/>
  <text x="98" y="76" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">SKILL WITHOUT AGREEMENT</text>
  <text x="98" y="98" font-size="16" font-weight="600" fill="#071c2c">Confident and wrong</text>
  <text x="98" y="118" font-size="11.8" fill="#31505c">Everyone builds their own analysis, and</text>
  <text x="98" y="134" font-size="11.8" fill="#31505c">four teams arrive at four revenue numbers.</text>
  <text x="98" y="150" font-size="11.8" fill="#31505c">The skill is real; the shared definition is</text>
  <text x="98" y="166" font-size="11.8" fill="#31505c">missing.</text>
  <!-- Genuinely data-driven -->
  <rect x="397" y="48" width="299" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="397" y="48" width="299" height="4" fill="#0a7568"/>
  <text x="417" y="76" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">THE GOAL</text>
  <text x="417" y="98" font-size="16" font-weight="600" fill="#071c2c">Genuinely data-driven</text>
  <text x="417" y="118" font-size="11.8" fill="#31505c">People ask good questions and get one</text>
  <text x="417" y="134" font-size="11.8" fill="#31505c">trusted answer. The only quadrant where</text>
  <text x="417" y="150" font-size="11.8" fill="#31505c">a dashboard actually changes a decision.</text>
  <!-- Running on gut feel -->
  <rect x="78" y="212" width="299" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="78" y="212" width="299" height="4" fill="#095b73"/>
  <text x="98" y="240" font-size="9.5" font-weight="700" fill="#095b73" letter-spacing="1.3">THE STARTING POINT</text>
  <text x="98" y="262" font-size="16" font-weight="600" fill="#071c2c">Running on gut feel</text>
  <text x="98" y="282" font-size="11.8" fill="#31505c">Data exists but nobody trusts it or uses it.</text>
  <text x="98" y="298" font-size="11.8" fill="#31505c">Start with the decisions people already</text>
  <text x="98" y="314" font-size="11.8" fill="#31505c">make, not with a catalogue.</text>
  <!-- Governed but unused -->
  <rect x="397" y="212" width="299" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="397" y="212" width="299" height="4" fill="#ec6d57"/>
  <text x="417" y="240" font-size="9.5" font-weight="700" fill="#ec6d57" letter-spacing="1.3">COMPLIANCE THEATRE</text>
  <text x="417" y="262" font-size="16" font-weight="600" fill="#071c2c">Governed but unused</text>
  <text x="417" y="282" font-size="11.8" fill="#31505c">The glossary is complete, the policies are</text>
  <text x="417" y="298" font-size="11.8" fill="#31505c">approved, and nobody opens either.</text>
  <text x="417" y="314" font-size="11.8" fill="#31505c">Governance became paperwork.</text>
  <line x1="58" y1="356" x2="58" y2="48" stroke="#dfe3e7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="50" y="202" font-size="10" font-weight="700" fill="#31505c" letter-spacing="1.2" text-anchor="middle" transform="rotate(-90 50 202)">DATA LITERACY</text>
  <line x1="78" y1="374" x2="696" y2="374" stroke="#dfe3e7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="387" y="392" font-size="10" font-weight="700" fill="#31505c" letter-spacing="1.2" text-anchor="middle">DATA GOVERNANCE MATURITY</text>
</svg>
