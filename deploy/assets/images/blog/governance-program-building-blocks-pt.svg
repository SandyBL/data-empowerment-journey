<svg xmlns="http://www.w3.org/2000/svg" width="720" height="449" viewBox="0 0 720 449" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Os seis pilares de um programa de governança de dados</title>
  <desc id="desc">Seis componentes que um programa de governança precisa ao mesmo tempo — estratégia e escopo, papéis e responsabilidade, políticas e padrões, processos e fluxo de trabalho, metadados e catálogo, e as métricas que provam que funciona.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">OS SEIS PILARES DE UM PROGRAMA DE GOVERNANÇA</text>
  
  <!-- Estratégia e escopo -->
  <rect x="24" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="72" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">PILAR 01</text>
  <text x="44" y="93" font-size="15" font-weight="600" fill="#071c2c">Estratégia e escopo</text>
  <text x="44" y="113" font-size="11.8" fill="#31505c">Dois ou três resultados de negócio de que a</text>
  <text x="44" y="129" font-size="11.8" fill="#31505c">governança responde, e tudo o que ela</text>
  <text x="44" y="145" font-size="11.8" fill="#31505c">explicitamente ainda não faz.</text>
  <!-- Papéis e responsabilidade -->
  <rect x="370" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="48" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="72" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">PILAR 02</text>
  <text x="390" y="93" font-size="15" font-weight="600" fill="#071c2c">Papéis e responsabilidade</text>
  <text x="390" y="113" font-size="11.8" fill="#31505c">Donos e stewards com nome por domínio, com</text>
  <text x="390" y="129" font-size="11.8" fill="#31505c">os direitos de decisão que de fato possuem.</text>
  <!-- Políticas e padrões -->
  <rect x="24" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="181" width="4" height="113" fill="#095b73"/>
  <text x="44" y="205" font-size="9.5" font-weight="700" fill="#095b73" letter-spacing="1.3">PILAR 03</text>
  <text x="44" y="226" font-size="15" font-weight="600" fill="#071c2c">Políticas e padrões</text>
  <text x="44" y="246" font-size="11.8" fill="#31505c">Regras curtas que as pessoas consigam</text>
  <text x="44" y="262" font-size="11.8" fill="#31505c">seguir, escritas onde o trabalho acontece.</text>
  <!-- Processos e fluxo -->
  <rect x="370" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="181" width="4" height="113" fill="#ec6d57"/>
  <text x="390" y="205" font-size="9.5" font-weight="700" fill="#ec6d57" letter-spacing="1.3">PILAR 04</text>
  <text x="390" y="226" font-size="15" font-weight="600" fill="#071c2c">Processos e fluxo</text>
  <text x="390" y="246" font-size="11.8" fill="#31505c">Como uma definição é aprovada, uma regra é</text>
  <text x="390" y="262" font-size="11.8" fill="#31505c">alterada e uma exceção é concedida.</text>
  <!-- Metadados e catálogo -->
  <rect x="24" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="314" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="338" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">PILAR 05</text>
  <text x="44" y="359" font-size="15" font-weight="600" fill="#071c2c">Metadados e catálogo</text>
  <text x="44" y="379" font-size="11.8" fill="#31505c">Um único lugar para consultar o que um</text>
  <text x="44" y="395" font-size="11.8" fill="#31505c">campo significa, de onde vem e a quem</text>
  <text x="44" y="411" font-size="11.8" fill="#31505c">perguntar.</text>
  <!-- Métricas e relatórios -->
  <rect x="370" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="314" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="338" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">PILAR 06</text>
  <text x="390" y="359" font-size="15" font-weight="600" fill="#071c2c">Métricas e relatórios</text>
  <text x="390" y="379" font-size="11.8" fill="#31505c">Poucas medidas que mostrem que os</text>
  <text x="390" y="395" font-size="11.8" fill="#31505c">resultados se moveram, na cadência do</text>
  <text x="390" y="411" font-size="11.8" fill="#31505c">negócio.</text>
</svg>
