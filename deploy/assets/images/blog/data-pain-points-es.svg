<svg xmlns="http://www.w3.org/2000/svg" width="720" height="449" viewBox="0 0 720 449" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Seis puntos de dolor de datos y la acción de gobierno que exige cada uno</title>
  <desc id="desc">Seis síntomas recurrentes — informes que no cuadran, conciliación manual, ausencia de propietario, accesos lentos, métricas inexplicables y registros duplicados — cada uno con la primera acción de gobierno que justifica.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">SEIS PUNTOS DE DOLOR QUE INDICAN POR DÓNDE EMPEZAR</text>
  
  <!-- Dos informes, una verdad -->
  <rect x="24" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="72" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">SÍNTOMA 01</text>
  <text x="44" y="93" font-size="15" font-weight="600" fill="#071c2c">Dos informes, una verdad</text>
  <text x="44" y="113" font-size="11.8" fill="#31505c">Finanzas y ventas dan ingresos distintos para</text>
  <text x="44" y="129" font-size="11.8" fill="#31505c">el mismo mes. Empieza por una definición</text>
  <text x="44" y="145" font-size="11.8" fill="#31505c">acordada y un propietario con nombre.</text>
  <!-- La hoja de cálculo intermedia -->
  <rect x="370" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="48" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="72" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">SÍNTOMA 02</text>
  <text x="390" y="93" font-size="15" font-weight="600" fill="#071c2c">La hoja de cálculo intermedia</text>
  <text x="390" y="113" font-size="11.8" fill="#31505c">Alguien concilia las cifras a mano cada mes.</text>
  <text x="390" y="129" font-size="11.8" fill="#31505c">Lleva la regla al pipeline antes de comprar una</text>
  <text x="390" y="145" font-size="11.8" fill="#31505c">herramienta.</text>
  <!-- Nadie es dueño del campo -->
  <rect x="24" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="181" width="4" height="113" fill="#095b73"/>
  <text x="44" y="205" font-size="9.5" font-weight="700" fill="#095b73" letter-spacing="1.3">SÍNTOMA 03</text>
  <text x="44" y="226" font-size="15" font-weight="600" fill="#071c2c">Nadie es dueño del campo</text>
  <text x="44" y="246" font-size="11.8" fill="#31505c">Todos usan el estado del cliente y nadie</text>
  <text x="44" y="262" font-size="11.8" fill="#31505c">decide qué significa. Asigna primero el</text>
  <text x="44" y="278" font-size="11.8" fill="#31505c">propietario y después el steward.</text>
  <!-- El acceso tarda tres semanas -->
  <rect x="370" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="181" width="4" height="113" fill="#ec6d57"/>
  <text x="390" y="205" font-size="9.5" font-weight="700" fill="#ec6d57" letter-spacing="1.3">SÍNTOMA 04</text>
  <text x="390" y="226" font-size="15" font-weight="600" fill="#071c2c">El acceso tarda tres semanas</text>
  <text x="390" y="246" font-size="11.8" fill="#31505c">Las solicitudes esperan tras una ruta de</text>
  <text x="390" y="262" font-size="11.8" fill="#31505c">aprobación no escrita. Publica la ruta y la</text>
  <text x="390" y="278" font-size="11.8" fill="#31505c">decisión que debe seguir.</text>
  <!-- La métrica que nadie explica -->
  <rect x="24" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="314" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="338" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">SÍNTOMA 05</text>
  <text x="44" y="359" font-size="15" font-weight="600" fill="#071c2c">La métrica que nadie explica</text>
  <text x="44" y="379" font-size="11.8" fill="#31505c">El número del dashboard no tiene trazabilidad</text>
  <text x="44" y="395" font-size="11.8" fill="#31505c">hasta el origen. Documenta el cálculo donde el</text>
  <text x="44" y="411" font-size="11.8" fill="#31505c">lector lo verá.</text>
  <!-- El mismo cliente, cuatro veces -->
  <rect x="370" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="314" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="338" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">SÍNTOMA 06</text>
  <text x="390" y="359" font-size="15" font-weight="600" fill="#071c2c">El mismo cliente, cuatro veces</text>
  <text x="390" y="379" font-size="11.8" fill="#31505c">Los registros duplicados inflan cualquier</text>
  <text x="390" y="395" font-size="11.8" fill="#31505c">recuento. Acuerda la regla de coincidencia</text>
  <text x="390" y="411" font-size="11.8" fill="#31505c">antes de deduplicar.</text>
</svg>
