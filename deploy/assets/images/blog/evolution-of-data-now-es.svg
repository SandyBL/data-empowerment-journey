<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">LA EVOLUCIÓN DEL DATO CORPORATIVO</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Desde el Registro Operativo Básico Hasta el Gobierno Estratégico de Datos</text>

  <!-- STEP 1 -->
  <g transform="translate(18, 75)">
    <rect width="160" height="310" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="160" height="6" rx="3" fill="#64748b"/>
    <rect x="10" y="16" width="55" height="18" rx="3" fill="#475569" fill-opacity="0.3"/>
    <text x="37" y="29" text-anchor="middle" font-size="9" font-weight="800" fill="#94a3b8">ETAPA 01</text>
    <text x="10" y="54" font-size="13" font-weight="700" fill="#f8fafc">Registro Básico</text>
    <text x="10" y="68" font-size="10" font-weight="600" fill="#64748b">1990s – 2000s</text>

    <line x1="10" y1="78" x2="150" y2="78" stroke="#334155" stroke-width="1"/>

    <text x="10" y="96" font-size="10" font-weight="700" fill="#38bdf8">Enfoque Principal:</text>
    <text x="10" y="112" font-size="10" font-weight="400" fill="#94a3b8">• Registro transaccional</text>
    <text x="10" y="126" font-size="10" font-weight="400" fill="#94a3b8">• Control de inventario</text>
    <text x="10" y="140" font-size="10" font-weight="400" fill="#94a3b8">• Apuntes contables</text>

    <text x="10" y="168" font-size="10" font-weight="700" fill="#38bdf8">Arquitectura:</text>
    <text x="10" y="184" font-size="10" font-weight="400" fill="#94a3b8">• Sistemas mainframe</text>
    <text x="10" y="198" font-size="10" font-weight="400" fill="#94a3b8">• Bases aisladas</text>
    <text x="10" y="212" font-size="10" font-weight="400" fill="#94a3b8">• Cargas por lotes</text>

    <text x="10" y="240" font-size="10" font-weight="700" fill="#38bdf8">Nivel de Gobierno:</text>
    <text x="10" y="256" font-size="10" font-weight="400" fill="#94a3b8">• Mínimo / Exclusivo TI</text>
    <text x="10" y="270" font-size="10" font-weight="400" fill="#94a3b8">• Accesos por sistema</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(191, 75)">
    <rect width="160" height="310" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="160" height="6" rx="3" fill="#38bdf8"/>
    <rect x="10" y="16" width="55" height="18" rx="3" fill="#0284c7" fill-opacity="0.3"/>
    <text x="37" y="29" text-anchor="middle" font-size="9" font-weight="800" fill="#38bdf8">ETAPA 02</text>
    <text x="10" y="54" font-size="13" font-weight="700" fill="#f8fafc">BI y Dashboards</text>
    <text x="10" y="68" font-size="10" font-weight="600" fill="#38bdf8">Década 2010</text>

    <line x1="10" y1="78" x2="150" y2="78" stroke="#334155" stroke-width="1"/>

    <text x="10" y="96" font-size="10" font-weight="700" fill="#38bdf8">Enfoque Principal:</text>
    <text x="10" y="112" font-size="10" font-weight="400" fill="#94a3b8">• Reportes de tendencias</text>
    <text x="10" y="126" font-size="10" font-weight="400" fill="#94a3b8">• Paneles directivos</text>
    <text x="10" y="140" font-size="10" font-weight="400" fill="#94a3b8">• Análisis histórico</text>

    <text x="10" y="168" font-size="10" font-weight="700" fill="#38bdf8">Arquitectura:</text>
    <text x="10" y="184" font-size="10" font-weight="400" fill="#94a3b8">• Data Warehouses</text>
    <text x="10" y="198" font-size="10" font-weight="400" fill="#94a3b8">• Integración ETL</text>
    <text x="10" y="212" font-size="10" font-weight="400" fill="#94a3b8">• Reportes SQL</text>

    <text x="10" y="240" font-size="10" font-weight="700" fill="#38bdf8">Nivel de Gobierno:</text>
    <text x="10" y="256" font-size="10" font-weight="400" fill="#94a3b8">• Reglas centralizadas</text>
    <text x="10" y="270" font-size="10" font-weight="400" fill="#94a3b8">• Peticiones lentas a TI</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(364, 75)">
    <rect width="160" height="310" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="160" height="6" rx="3" fill="#ef4444"/>
    <rect x="10" y="16" width="55" height="18" rx="3" fill="#dc2626" fill-opacity="0.3"/>
    <text x="37" y="29" text-anchor="middle" font-size="9" font-weight="800" fill="#fca5a5">ETAPA 03</text>
    <text x="10" y="54" font-size="13" font-weight="700" fill="#f8fafc">Caos de Datos</text>
    <text x="10" y="68" font-size="10" font-weight="600" fill="#ef4444">Finales 2010 – 2020</text>

    <line x1="10" y1="78" x2="150" y2="78" stroke="#334155" stroke-width="1"/>

    <text x="10" y="96" font-size="10" font-weight="700" fill="#38bdf8">Problemas Clave:</text>
    <text x="10" y="112" font-size="10" font-weight="400" fill="#94a3b8">• Exceso de dashboards</text>
    <text x="10" y="126" font-size="10" font-weight="400" fill="#94a3b8">• Métricas discrepantes</text>
    <text x="10" y="140" font-size="10" font-weight="400" fill="#94a3b8">• Riesgo de privacidad</text>

    <text x="10" y="168" font-size="10" font-weight="700" fill="#38bdf8">Arquitectura:</text>
    <text x="10" y="184" font-size="10" font-weight="400" fill="#94a3b8">• Data Lakes sin control</text>
    <text x="10" y="198" font-size="10" font-weight="400" fill="#94a3b8">• Herramientas en sombra</text>
    <text x="10" y="212" font-size="10" font-weight="400" fill="#94a3b8">• Pipelines duplicados</text>

    <text x="10" y="240" font-size="10" font-weight="700" fill="#38bdf8">Nivel de Gobierno:</text>
    <text x="10" y="256" font-size="10" font-weight="400" fill="#94a3b8">• Fragmentado / Inexistente</text>
    <text x="10" y="270" font-size="10" font-weight="400" fill="#94a3b8">• Alto riesgo de negocio</text>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(537, 75)">
    <rect width="165" height="310" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="165" height="6" rx="3" fill="#22c55e"/>
    <rect x="10" y="16" width="55" height="18" rx="3" fill="#16a34a" fill-opacity="0.3"/>
    <text x="37" y="29" text-anchor="middle" font-size="9" font-weight="800" fill="#4ade80">ETAPA 04</text>
    <text x="10" y="54" font-size="13" font-weight="700" fill="#f8fafc">Gobierno Estratégico</text>
    <text x="10" y="68" font-size="10" font-weight="600" fill="#4ade80">Estrategia Actual</text>

    <line x1="10" y1="78" x2="155" y2="78" stroke="#334155" stroke-width="1"/>

    <text x="10" y="96" font-size="10" font-weight="700" fill="#38bdf8">Impacto Estratégico:</text>
    <text x="10" y="112" font-size="10" font-weight="400" fill="#94a3b8">• Única fuente de verdad</text>
    <text x="10" y="126" font-size="10" font-weight="400" fill="#94a3b8">• Autoservicio gobernado</text>
    <text x="10" y="140" font-size="10" font-weight="400" fill="#94a3b8">• Preparación para IA</text>

    <text x="10" y="168" font-size="10" font-weight="700" fill="#38bdf8">Arquitectura:</text>
    <text x="10" y="184" font-size="10" font-weight="400" fill="#94a3b8">• Catálogo de metadatos</text>
    <text x="10" y="198" font-size="10" font-weight="400" fill="#94a3b8">• Data Mesh / Dominios</text>
    <text x="10" y="212" font-size="10" font-weight="400" fill="#94a3b8">• Enmascaramiento PII</text>

    <text x="10" y="240" font-size="10" font-weight="700" fill="#38bdf8">Nivel de Gobierno:</text>
    <text x="10" y="256" font-size="10" font-weight="400" fill="#94a3b8">• Propiedad por dominios</text>
    <text x="10" y="270" font-size="10" font-weight="400" fill="#94a3b8">• Calidad automatizada</text>
  </g>
</svg>
