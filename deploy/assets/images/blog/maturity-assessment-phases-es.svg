<svg width="720" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="450" fill="#0f172a"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">CUATRO FASES DE LA EVALUACIÓN DE MADUREZ DE GOBIERNO</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Un Enfoque Diagnóstico Estructurado para la Transformación de Datos</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">FASE 01</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Preparación y Alcance</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Formar equipo interdepartamental (TI, Negocio, Legal)</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Definir objetivos estratégicos e impulsores de negocio</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Identificar dominios de datos y alcance regulatorio</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Asegurar el patrocinio ejecutivo y presupuesto</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(375, 75)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">FASE 02</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Evaluación y Evidencia</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Seleccionar marco (DAMA DMM, DCAM, Gartner)</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Realizar encuestas y entrevistas estructuradas</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Revisar documentos de políticas, glosarios y arquitectura</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Auditar niveles de calidad de datos y reglas actuales</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(20, 255)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">FASE 03</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Análisis y Mapeo de Niveles</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Puntuar capacidades según los niveles del modelo</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Mapear niveles de madurez por dominios específicos</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Identificar brechas críticas entre estado actual y meta</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Comparar resultados con los estándares del sector</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(375, 255)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">FASE 04</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Hoja de Ruta y Acción</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Priorizar éxitos rápidos y metas a largo plazo</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Definir roles de Data Ownership y Data Stewardship</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Estimar presupuestos de software, formación y recursos</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Establecer ciclos de revisión y reevaluación continua</text>
  </g>
</svg>
