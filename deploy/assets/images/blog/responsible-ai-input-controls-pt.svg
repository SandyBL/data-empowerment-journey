<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Os quatro pontos de controle entre um sistema de origem e uma decisão de IA</title>
  <desc id="desc">Uma cadeia do sistema de origem ao conjunto de treino, ao modelo e à decisão, com o controle de governança que precisa valer em cada salto, e uma notificação de mudança que volta da origem para tudo o que depende dela.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">IA RESPONSÁVEL: GOVERNE AS ENTRADAS, NÃO A SAÍDA</text>
  
  <!-- Sistema de origem -->
  <rect x="24" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="156" height="4" fill="#071c2c"/>
  <text x="102" y="84" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Sistema de origem</text>
  <text x="102" y="128" font-size="11" fill="#31505c" text-anchor="middle">Apenas fontes aprovadas,</text>
  <text x="102" y="143" font-size="11" fill="#31505c" text-anchor="middle">cada uma com um dono</text>
  <text x="102" y="158" font-size="11" fill="#31505c" text-anchor="middle">nomeado.</text>
  <line x1="184" y1="76" x2="192" y2="76" stroke="#31505c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Conjunto de treino -->
  <rect x="196" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="196" y="48" width="156" height="4" fill="#0a7568"/>
  <text x="274" y="84" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Conjunto de treino</text>
  <text x="274" y="128" font-size="11" fill="#31505c" text-anchor="middle">Etiquetas de finalidade</text>
  <text x="274" y="143" font-size="11" fill="#31505c" text-anchor="middle">que dizem para que o</text>
  <text x="274" y="158" font-size="11" fill="#31505c" text-anchor="middle">dado pode servir.</text>
  <line x1="356" y1="76" x2="364" y2="76" stroke="#31505c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Modelo -->
  <rect x="368" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="368" y="48" width="156" height="4" fill="#095b73"/>
  <text x="446" y="84" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Modelo</text>
  <text x="446" y="128" font-size="11" fill="#31505c" text-anchor="middle">Linhagem registrada de</text>
  <text x="446" y="143" font-size="11" fill="#31505c" text-anchor="middle">cada atributo até sua</text>
  <text x="446" y="158" font-size="11" fill="#31505c" text-anchor="middle">origem.</text>
  <line x1="528" y1="76" x2="536" y2="76" stroke="#31505c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Decisão -->
  <rect x="540" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="540" y="48" width="156" height="4" fill="#ec6d57"/>
  <text x="618" y="84" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Decisão</text>
  <text x="618" y="128" font-size="11" fill="#31505c" text-anchor="middle">Uma pessoa responsável</text>
  <text x="618" y="143" font-size="11" fill="#31505c" text-anchor="middle">pelo resultado, não o</text>
  <text x="618" y="158" font-size="11" fill="#31505c" text-anchor="middle">algoritmo.</text>
  <!-- MUDANÇA NA ORIGEM AVISA A CADEIA TODA: what sends the reader back to the first stage. -->
  <path d="M 618 174 V 200 H 102 V 178" fill="none" stroke="#0a7568" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-loop)"/>
  <rect x="192.502082" y="191" width="334.995836" height="18" fill="#ffffff"/>
  <text x="360" y="203.5" font-size="10" font-weight="700" fill="#0a7568" letter-spacing="1.2" text-anchor="middle">MUDANÇA NA ORIGEM AVISA A CADEIA TODA</text>
</svg>
