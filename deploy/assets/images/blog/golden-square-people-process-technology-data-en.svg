<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">People, process, technology and data, and how each one fails alone</title>
  <desc id="desc">The four pillars of data governance — people, process, technology and data — each with what it contributes and the specific way a governance programme fails when that pillar is missing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">THE FOUR THINGS GOVERNANCE HAS TO GET RIGHT</text>
  
  <!-- People -->
  <rect x="24" y="48" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="326" height="4" fill="#071c2c"/>
  <text x="44" y="76" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">WITHOUT IT: NOBODY DECIDES</text>
  <text x="44" y="98" font-size="16" font-weight="600" fill="#071c2c">People</text>
  <text x="44" y="118" font-size="11.8" fill="#31505c">Named owners and stewards who hold real</text>
  <text x="44" y="134" font-size="11.8" fill="#31505c">decision rights. Miss this and every definition</text>
  <text x="44" y="150" font-size="11.8" fill="#31505c">stays open, because nobody has the job of</text>
  <text x="44" y="166" font-size="11.8" fill="#31505c">closing it.</text>
  <!-- Process -->
  <rect x="370" y="48" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="48" width="326" height="4" fill="#0a7568"/>
  <text x="390" y="76" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">WITHOUT IT: EVERY CASE IS NEW</text>
  <text x="390" y="98" font-size="16" font-weight="600" fill="#071c2c">Process</text>
  <text x="390" y="118" font-size="11.8" fill="#31505c">The repeatable path from a question to an</text>
  <text x="390" y="134" font-size="11.8" fill="#31505c">approved answer. Miss this and each definition</text>
  <text x="390" y="150" font-size="11.8" fill="#31505c">gets re-argued from scratch in a different</text>
  <text x="390" y="166" font-size="11.8" fill="#31505c">meeting.</text>
  <!-- Technology -->
  <rect x="24" y="212" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="212" width="326" height="4" fill="#095b73"/>
  <text x="44" y="240" font-size="9.5" font-weight="700" fill="#095b73" letter-spacing="1.3">WITHOUT IT: NOTHING SCALES</text>
  <text x="44" y="262" font-size="16" font-weight="600" fill="#071c2c">Technology</text>
  <text x="44" y="282" font-size="11.8" fill="#31505c">The catalogue, the lineage, the automated</text>
  <text x="44" y="298" font-size="11.8" fill="#31505c">checks. Miss this and the rules live in a</text>
  <text x="44" y="314" font-size="11.8" fill="#31505c">spreadsheet that only its author maintains.</text>
  <!-- Data -->
  <rect x="370" y="212" width="326" height="144" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="212" width="326" height="4" fill="#ec6d57"/>
  <text x="390" y="240" font-size="9.5" font-weight="700" fill="#ec6d57" letter-spacing="1.3">WITHOUT IT: IT IS ALL THEORY</text>
  <text x="390" y="262" font-size="16" font-weight="600" fill="#071c2c">Data</text>
  <text x="390" y="282" font-size="11.8" fill="#31505c">The actual definitions, quality rules and</text>
  <text x="390" y="298" font-size="11.8" fill="#31505c">classifications. Miss this and you have a</text>
  <text x="390" y="314" font-size="11.8" fill="#31505c">governance framework that governs nothing.</text>
</svg>
