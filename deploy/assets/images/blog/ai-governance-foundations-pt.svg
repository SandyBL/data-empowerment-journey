<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">6 MOTIVOS PELOS QUAIS OS PILOTOS DE IA NÃO ESCALAM</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Por Que 70% dos Projetos de GenAI Nunca Chegam à Produção</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">FALHA 01</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Dados Não Validados</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Treinar modelos de IA com</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">registros duplicados ou sem</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">revisão causa alucinações</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">graves e dados incorretos.</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(253, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">FALHA 02</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Falta de Data Owners</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Ausência de donos de dados de</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">negócio para autorizar acessos,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">validar regras e homologar as</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">bases do sistema RAG.</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(486, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">FALHA 03</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Prazos Irrealistas</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Pressão da diretoria por ROI</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">rápido força as equipes a</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">pular a preparação básica e</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">as travas de qualidade.</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(20, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">FALHA 04</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Riscos com a LGPD</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Inserir dados pessoais sem</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">mascaramento em IA pública</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">gera graves punições legais</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">e vazamento de dados.</text>
  </g>

  <!-- CARD 05 -->
  <g transform="translate(253, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#ec4899"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#db2777" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="0.5">FALHA 05</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Respostas Sem Linhagem</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">A falta de rastreabilidade</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">automatizada torna impossível</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">auditar, explicar ou justificar as</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">decisões tomadas pela IA.</text>
  </g>

  <!-- CARD 06 -->
  <g transform="translate(486, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="14" width="76" height="18" rx="3" fill="#475569" fill-opacity="0.25"/>
    <text x="50" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">FALHA 06</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Baixa Literacia de Dados</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Colaboradores não possuem</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">treinamento em ética, uso de</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">prompts, privacidade e análise</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">crítica dos dados gerados.</text>
  </g>
</svg>
