<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Los cuatro puntos de control entre un sistema origen y una decisión de IA</title>
  <desc id="desc">Una cadena del sistema origen al conjunto de entrenamiento, al modelo y a la decisión, con el control de gobierno que debe cumplirse en cada salto, y una notificación de cambio que vuelve del origen a todo lo que depende de él.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">IA RESPONSABLE: GOBIERNA LAS ENTRADAS, NO LA SALIDA</text>
  
  <!-- Sistema origen -->
  <rect x="24" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="156" height="4" fill="#071c2c"/>
  <text x="102" y="84" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Sistema origen</text>
  <text x="102" y="128" font-size="11" fill="#31505c" text-anchor="middle">Solo fuentes aprobadas,</text>
  <text x="102" y="143" font-size="11" fill="#31505c" text-anchor="middle">cada una con un</text>
  <text x="102" y="158" font-size="11" fill="#31505c" text-anchor="middle">propietario con nombre.</text>
  <line x1="184" y1="76" x2="192" y2="76" stroke="#31505c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Conjunto de entrenamiento -->
  <rect x="196" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="196" y="48" width="156" height="4" fill="#0a7568"/>
  <text x="274" y="76" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Conjunto de</text>
  <text x="274" y="92" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">entrenamiento</text>
  <text x="274" y="128" font-size="11" fill="#31505c" text-anchor="middle">Etiquetas de finalidad que</text>
  <text x="274" y="143" font-size="11" fill="#31505c" text-anchor="middle">dicen para qué puede</text>
  <text x="274" y="158" font-size="11" fill="#31505c" text-anchor="middle">usarse el dato.</text>
  <line x1="356" y1="76" x2="364" y2="76" stroke="#31505c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Modelo -->
  <rect x="368" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="368" y="48" width="156" height="4" fill="#095b73"/>
  <text x="446" y="84" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Modelo</text>
  <text x="446" y="128" font-size="11" fill="#31505c" text-anchor="middle">Linaje registrado de cada</text>
  <text x="446" y="143" font-size="11" fill="#31505c" text-anchor="middle">atributo hasta su origen.</text>
  <line x1="528" y1="76" x2="536" y2="76" stroke="#31505c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Decisión -->
  <rect x="540" y="48" width="156" height="56" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="540" y="48" width="156" height="4" fill="#ec6d57"/>
  <text x="618" y="84" font-size="13" font-weight="600" fill="#071c2c" text-anchor="middle">Decisión</text>
  <text x="618" y="128" font-size="11" fill="#31505c" text-anchor="middle">Una persona responsable</text>
  <text x="618" y="143" font-size="11" fill="#31505c" text-anchor="middle">del resultado, no el</text>
  <text x="618" y="158" font-size="11" fill="#31505c" text-anchor="middle">algoritmo.</text>
  <!-- UN CAMBIO EN EL ORIGEN AVISA A LA CADENA: what sends the reader back to the first stage. -->
  <path d="M 618 174 V 200 H 102 V 178" fill="none" stroke="#0a7568" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-loop)"/>
  <rect x="185.267873" y="191" width="349.464254" height="18" fill="#ffffff"/>
  <text x="360" y="203.5" font-size="10" font-weight="700" fill="#0a7568" letter-spacing="1.2" text-anchor="middle">UN CAMBIO EN EL ORIGEN AVISA A LA CADENA</text>
</svg>
