<svg width="720" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="450" fill="#0f172a"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">6 CUSTOS DIRETO DAS FALHAS NA QUALIDADE DE DADOS</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Impactos Financeiros no Capital de Giro, Confiança do Cliente e Faturamento</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">CUSTO 01</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Falhas de Faturamento</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Cadastros de clientes incorretos</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">bloqueiam a emissão de notas</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">fiscais, atrasando o recebimento</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">e o capital de giro.</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(253, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">CUSTO 02</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Gastos com Atendimento</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Dados cadastrais desatualizados</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">aumentam o tempo de suporte,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">elevam os custos operacionais e</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">geram insatisfação.</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(486, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">CUSTO 03</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Perda de Vendas</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Bases de contatos incompletas ou</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">duplicadas impedem ações de</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">vendas direcionadas e geram</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">perda de novas receitas.</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(20, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">CUSTO 04</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Atrasos em M&amp;A</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Sistemas legados incompatíveis e</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">dados duplicados desaceleram a</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">integração corporativa e elevam</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">custos de consultoria (+R$2,5M).</text>
  </g>

  <!-- CARD 05 -->
  <g transform="translate(253, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#ec4899"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#db2777" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="0.5">CUSTO 05</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Exposição a Fraudes</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">A falta de travas de validação</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">e de auditoria contínua facilita</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">que atividades ilícitas passem</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">despercebidas pelos sistemas.</text>
  </g>

  <!-- CARD 06 -->
  <g transform="translate(486, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#475569" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">CUSTO 06</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Estratégias Incorretas</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Decisões executivas tomadas com</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">base em relatórios incorretos</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">geram investimentos mal</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">direcionados e perdas.</text>
  </g>
</svg>
