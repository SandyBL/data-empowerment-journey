<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">A fronteira entre governança de dados e gestão de dados</title>
  <desc id="desc">Três artefatos compartilhados — o glossário de negócio, as regras de qualidade e a política de acesso — com a decisão que cada um exige da governança à esquerda e a entrega que cada um exige da gestão de dados à direita.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">ONDE A GOVERNANÇA TERMINA E A GESTÃO COMEÇA</text>
  
  <rect x="24" y="48" width="216" height="34" rx="5" fill="#071c2c"/>
  <text x="132" y="70" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1.3" text-anchor="middle">A GOVERNANÇA DECIDE</text>
  <rect x="252" y="48" width="216" height="34" rx="5" fill="#ec6d57"/>
  <text x="360" y="70" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1.3" text-anchor="middle">ARTEFATO COMUM</text>
  <rect x="480" y="48" width="216" height="34" rx="5" fill="#095b73"/>
  <text x="588" y="70" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1.3" text-anchor="middle">A GESTÃO ENTREGA</text>
  <!-- Glossário de negócio -->
  <rect x="24" y="92" width="216" height="74" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="92" width="4" height="74" fill="#071c2c"/>
  <text x="42" y="118" font-size="11.4" fill="#31505c">Aprova a definição de cliente</text>
  <text x="42" y="134" font-size="11.4" fill="#31505c">ativo e nomeia o dono que a</text>
  <text x="42" y="150" font-size="11.4" fill="#31505c">defende.</text>
  <rect x="480" y="92" width="216" height="74" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="480" y="92" width="4" height="74" fill="#095b73"/>
  <text x="498" y="118" font-size="11.4" fill="#31505c">Publica no catálogo e liga às</text>
  <text x="498" y="134" font-size="11.4" fill="#31505c">tabelas e relatórios que a</text>
  <text x="498" y="150" font-size="11.4" fill="#31505c">utilizam.</text>
  <rect x="252" y="92" width="216" height="74" rx="5" fill="#ffffff" stroke="#ec6d57"/>
  <text x="360" y="134" font-size="14" font-weight="600" fill="#071c2c" text-anchor="middle">Glossário de negócio</text>
  <line x1="241" y1="129" x2="249" y2="129" stroke="#31505c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="479" y1="129" x2="471" y2="129" stroke="#31505c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Regras de qualidade -->
  <rect x="24" y="176" width="216" height="74" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="176" width="4" height="74" fill="#071c2c"/>
  <text x="42" y="202" font-size="11.4" fill="#31505c">Define o limite considerado</text>
  <text x="42" y="218" font-size="11.4" fill="#31505c">aceitável e quem é acionado</text>
  <text x="42" y="234" font-size="11.4" fill="#31505c">quando ele quebra.</text>
  <rect x="480" y="176" width="216" height="74" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="480" y="176" width="4" height="74" fill="#095b73"/>
  <text x="498" y="202" font-size="11.4" fill="#31505c">Executa os controles no pipeline</text>
  <text x="498" y="218" font-size="11.4" fill="#31505c">e põe em quarentena os</text>
  <text x="498" y="234" font-size="11.4" fill="#31505c">registros reprovados.</text>
  <rect x="252" y="176" width="216" height="74" rx="5" fill="#ffffff" stroke="#ec6d57"/>
  <text x="360" y="218" font-size="14" font-weight="600" fill="#071c2c" text-anchor="middle">Regras de qualidade</text>
  <line x1="241" y1="213" x2="249" y2="213" stroke="#31505c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="479" y1="213" x2="471" y2="213" stroke="#31505c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Política de acesso -->
  <rect x="24" y="260" width="216" height="74" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="260" width="4" height="74" fill="#071c2c"/>
  <text x="42" y="286" font-size="11.4" fill="#31505c">Decide quem pode ver quais</text>
  <text x="42" y="302" font-size="11.4" fill="#31505c">dados, para qual finalidade e</text>
  <text x="42" y="318" font-size="11.4" fill="#31505c">por quanto tempo.</text>
  <rect x="480" y="260" width="216" height="74" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="480" y="260" width="4" height="74" fill="#095b73"/>
  <text x="498" y="286" font-size="11.4" fill="#31505c">Provisiona os papéis, aplica o</text>
  <text x="498" y="302" font-size="11.4" fill="#31505c">mascaramento e gera a trilha de</text>
  <text x="498" y="318" font-size="11.4" fill="#31505c">auditoria.</text>
  <rect x="252" y="260" width="216" height="74" rx="5" fill="#ffffff" stroke="#ec6d57"/>
  <text x="360" y="302" font-size="14" font-weight="600" fill="#071c2c" text-anchor="middle">Política de acesso</text>
  <line x1="241" y1="297" x2="249" y2="297" stroke="#31505c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="479" y1="297" x2="471" y2="297" stroke="#31505c" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
