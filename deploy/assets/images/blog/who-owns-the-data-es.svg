<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">CUATRO CAUSAS RAÍZ DE LA BRECHA DE PROPIEDAD DE DATOS</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Por Qué las Empresas Tienen Datos "Tocados por Muchos, Propiedad de Nadie"</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">CAUSA 01</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Arquitecturas Complejas</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Sistemas legados conviviendo con la nube y SaaS</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Definiciones de datos solapadas e inconsistentes</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Flujos paralelos sin supervisión creando datos huérfanos</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Ausencia de mapas de linaje centralizados</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(375, 75)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">CAUSA 02</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Estructuras Obsoletas</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Organigramas diseñados para departamentos aislados</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Falta de alineación entre propiedad y dominios transversales</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Ausencia de Data Owners ejecutivos con presupuesto</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Funciones de datos omitidas en los puestos de trabajo</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(20, 255)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">CAUSA 03</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Desconexión Negocio-TI</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Negocio percibe los datos como un "problema de TI"</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Ingeniería obligada a tomar decisiones de reglas de negocio</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Falta de Data Stewards operativos en las áreas comerciales</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Prioridades desalineadas entre técnica y retorno comercial</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(375, 255)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">CAUSA 04</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Sin Responsabilidad Real</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Inexistencia de consecuencias ante fallos de calidad</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Traspaso de culpas entre áreas durante auditorías</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Sin Contratos de Datos entre productores y consumidores</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• SLAs de calidad excluidos de la evaluación directiva</text>
  </g>
</svg>
