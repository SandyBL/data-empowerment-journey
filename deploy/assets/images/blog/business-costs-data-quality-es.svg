<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">6 COSTES DIRECTOS DE LA MALA CALIDAD DE DATOS</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Impactos Financieros en la Caja, la Confianza del Cliente y la Facturación</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">COSTE 01</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Fallas de Facturación</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Datos de cliente incompletos</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">bloquean la facturación</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">automatizada, retrasando el cobro</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">y afectando a la liquidez.</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(253, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">COSTE 02</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Gastos de Soporte</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Registros maestros erróneos</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">elevan el volumen de llamadas,</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">alargan los tiempos de atención</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">y generan insatisfacción.</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(486, 75)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">COSTE 03</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Pérdida de Ventas</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Datos de contacto obsoletos</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">o duplicados impiden actuar</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">a tiempo sobre oportunidades</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">comerciales de venta cruzada.</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(20, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">COSTE 04</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Retrasos en M&amp;A</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Incompatibilidades de datos entre</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">sistemas heredados frena la</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">integración corporativa y eleva</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">los costes de consultoría +450k€.</text>
  </g>

  <!-- CARD 05 -->
  <g transform="translate(253, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#ec4899"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#db2777" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#f472b6" letter-spacing="0.5">COSTE 05</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Riesgo de Fraude</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">La ausencia de validaciones y de</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">supervisión operacional permite</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">que actividades fraudulentas</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">pasen desapercibidas.</text>
  </g>

  <!-- CARD 06 -->
  <g transform="translate(486, 255)">
    <rect width="213" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="213" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#475569" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">COSTE 06</text>
    <text x="12" y="52" font-size="13" font-weight="700" fill="#f8fafc">Decisiones Erróneas</text>
    <text x="12" y="72" font-size="11" font-weight="400" fill="#94a3b8">Decisiones directivas basadas en</text>
    <text x="12" y="87" font-size="11" font-weight="400" fill="#94a3b8">reportes imprecisos conducen a</text>
    <text x="12" y="102" font-size="11" font-weight="400" fill="#94a3b8">una mala asignación de capital</text>
    <text x="12" y="117" font-size="11" font-weight="400" fill="#94a3b8">y errores estratégicos.</text>
  </g>
</svg>
