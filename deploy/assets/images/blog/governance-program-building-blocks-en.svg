<svg xmlns="http://www.w3.org/2000/svg" width="720" height="449" viewBox="0 0 720 449" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The six building blocks of a data governance programme</title>
  <desc id="desc">Six components a governance programme needs together — strategy and scope, roles and accountability, policies and standards, processes and workflow, metadata and catalogue, and the metrics that prove it works.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#31505c"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a7568"/>
    </marker>
  </defs>

  <text x="24" y="24" font-size="10.5" font-weight="700" fill="#0a7568" letter-spacing="1.6">THE SIX BUILDING BLOCKS OF A GOVERNANCE PROGRAMME</text>
  
  <!-- Strategy and scope -->
  <rect x="24" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="48" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="72" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">BLOCK 01</text>
  <text x="44" y="93" font-size="15" font-weight="600" fill="#071c2c">Strategy and scope</text>
  <text x="44" y="113" font-size="11.8" fill="#31505c">Two or three business outcomes governance</text>
  <text x="44" y="129" font-size="11.8" fill="#31505c">answers for, and everything it is explicitly not</text>
  <text x="44" y="145" font-size="11.8" fill="#31505c">doing yet.</text>
  <!-- Roles and accountability -->
  <rect x="370" y="48" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="48" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="72" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">BLOCK 02</text>
  <text x="390" y="93" font-size="15" font-weight="600" fill="#071c2c">Roles and accountability</text>
  <text x="390" y="113" font-size="11.8" fill="#31505c">Named owners and stewards per domain, with</text>
  <text x="390" y="129" font-size="11.8" fill="#31505c">the decision rights each one actually holds.</text>
  <!-- Policies and standards -->
  <rect x="24" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="181" width="4" height="113" fill="#095b73"/>
  <text x="44" y="205" font-size="9.5" font-weight="700" fill="#095b73" letter-spacing="1.3">BLOCK 03</text>
  <text x="44" y="226" font-size="15" font-weight="600" fill="#071c2c">Policies and standards</text>
  <text x="44" y="246" font-size="11.8" fill="#31505c">Short rules people can follow, written where</text>
  <text x="44" y="262" font-size="11.8" fill="#31505c">the work happens rather than in a binder.</text>
  <!-- Processes and workflow -->
  <rect x="370" y="181" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="181" width="4" height="113" fill="#ec6d57"/>
  <text x="390" y="205" font-size="9.5" font-weight="700" fill="#ec6d57" letter-spacing="1.3">BLOCK 04</text>
  <text x="390" y="226" font-size="15" font-weight="600" fill="#071c2c">Processes and workflow</text>
  <text x="390" y="246" font-size="11.8" fill="#31505c">How a definition gets approved, a rule gets</text>
  <text x="390" y="262" font-size="11.8" fill="#31505c">changed, and an exception gets granted.</text>
  <!-- Metadata and catalogue -->
  <rect x="24" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="24" y="314" width="4" height="113" fill="#071c2c"/>
  <text x="44" y="338" font-size="9.5" font-weight="700" fill="#071c2c" letter-spacing="1.3">BLOCK 05</text>
  <text x="44" y="359" font-size="15" font-weight="600" fill="#071c2c">Metadata and catalogue</text>
  <text x="44" y="379" font-size="11.8" fill="#31505c">One place to look up what a field means,</text>
  <text x="44" y="395" font-size="11.8" fill="#31505c">where it comes from, and who to ask about it.</text>
  <!-- Metrics and reporting -->
  <rect x="370" y="314" width="326" height="113" rx="5" fill="#f8fafc" stroke="#dfe3e7"/>
  <rect x="370" y="314" width="4" height="113" fill="#0a7568"/>
  <text x="390" y="338" font-size="9.5" font-weight="700" fill="#0a7568" letter-spacing="1.3">BLOCK 06</text>
  <text x="390" y="359" font-size="15" font-weight="600" fill="#071c2c">Metrics and reporting</text>
  <text x="390" y="379" font-size="11.8" fill="#31505c">A handful of measures showing the outcomes</text>
  <text x="390" y="395" font-size="11.8" fill="#31505c">moved, on the same cadence as the business.</text>
</svg>
