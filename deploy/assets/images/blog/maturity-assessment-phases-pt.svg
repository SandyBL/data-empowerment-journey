<svg width="720" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="450" fill="#0f172a"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">QUATRO FASES DO DIAGNÓSTICO DE MATURIDADE DE GOVERNANÇA</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Uma Abordagem Diagnóstica Estruturada para Transformação de Dados</text>

  <!-- CARD 01 -->
  <g transform="translate(20, 75)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#38bdf8"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#0284c7" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#38bdf8" letter-spacing="0.5">FASE 01</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Preparação e Escopo</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Montar equipe multidisciplinar (TI, Negócios, Jurídico)</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Definir objetivos estratégicos e direcionadores</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Mapear domínios de dados e escopo regulatório/LGPD</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Garantir patrocínio executivo e orçamento</text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(375, 75)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#22c55e"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#16a34a" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#4ade80" letter-spacing="0.5">FASE 02</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Avaliação e Evidências</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Escolher modelo (DAMA DMM, DCAM, Gartner)</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Aplicar questionários e entrevistas estruturadas</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Revisar documentos de políticas, glossários e arquitetura</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Auditar níveis de qualidade de dados e regras atuais</text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(20, 255)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#f59e0b"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#d97706" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="0.5">FASE 03</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Análise e Mapeamento</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Pontuar capacidades de acordo com o modelo</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Mapear níveis de maturidade por domínios de negócio</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Identificar lacunas críticas entre o estado atual e a meta</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Comparar resultados com os padrões do mercado</text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(375, 255)">
    <rect width="325" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="325" height="4" rx="2" fill="#a855f7"/>
    <rect x="12" y="14" width="60" height="18" rx="3" fill="#9333ea" fill-opacity="0.25"/>
    <text x="42" y="27" text-anchor="middle" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="0.5">FASE 04</text>
    <text x="12" y="52" font-size="14" font-weight="700" fill="#f8fafc">Plano de Ação e Roadmap</text>
    <text x="12" y="74" font-size="11" font-weight="400" fill="#94a3b8">• Priorizar vitórias rápidas e metas de longo prazo</text>
    <text x="12" y="92" font-size="11" font-weight="400" fill="#94a3b8">• Definir papéis de Data Ownership e Data Stewardship</text>
    <text x="12" y="110" font-size="11" font-weight="400" fill="#94a3b8">• Estimar orçamentos para tecnologia, treinamento e recursos</text>
    <text x="12" y="128" font-size="11" font-weight="400" fill="#94a3b8">• Estabelecer ciclos de revisão e reavaliação contínua</text>
  </g>
</svg>
