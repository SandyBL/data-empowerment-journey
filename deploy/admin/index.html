<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Content Studio | The Data Empowerment Journey</title>
  <link rel="icon" href="/assets/images/dejourney-logo.jpg">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #071c2c; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #0c4f55, transparent 35%), #071c2c; }
    .auth-card { width: min(100%, 430px); padding: 40px; border: 1px solid rgba(255,255,255,.14); border-radius: 24px; background: rgba(255,255,255,.07); box-shadow: 0 30px 80px rgba(0,0,0,.28); backdrop-filter: blur(18px); }
    .auth-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 16px; }
    h1 { margin: 22px 0 8px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    p { color: #b9cbd2; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    input { width: 100%; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 13px 14px; background: rgba(255,255,255,.09); color: #fff; font: inherit; }
    button { width: 100%; margin-top: 22px; border: 0; border-radius: 999px; padding: 14px 18px; background: #62e6bd; color: #071c2c; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    .auth-error { min-height: 24px; color: #ffb8ad; font-size: .9rem; }
    .auth-shell[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="identity-gate" class="auth-shell">
    <form id="identity-form" class="auth-card">
      <img src="/assets/images/dejourney-logo.jpg" alt="The Data Empowerment Journey logo">
      <h1>Content Studio</h1>
      <p>Sign in with your Netlify Identity account to manage the English, Spanish, and Portuguese blogs.</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-button" type="submit">Sign in</button>
      <p id="auth-error" class="auth-error" role="alert"></p>
    </form>
  </main>

  <script type="module">
    import { getUser, login, handleAuthCallback, AuthError, MissingIdentityError } from 'https://esm.sh/@netlify/identity@1.2.0';

    const gate = document.querySelector('#identity-gate');
    const form = document.querySelector('#identity-form');
    const errorMessage = document.querySelector('#auth-error');
    const loginButton = document.querySelector('#login-button');

    const loadCms = () => {
      gate.hidden = true;
      if (document.querySelector('#decap-cms-script')) return;
      const script = document.createElement('script');
      script.id = 'decap-cms-script';
      script.src = 'https://unpkg.com/decap-cms@^3.8.3/dist/decap-cms.js';
      document.body.append(script);
    };

    try {
      await handleAuthCallback();
      if (await getUser()) loadCms();
    } catch (error) {
      errorMessage.textContent = error instanceof Error ? error.message : 'Unable to complete authentication.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.textContent = '';
      loginButton.disabled = true;
      loginButton.textContent = 'Signing in…';
      try {
        await login(form.email.value, form.password.value);
        loadCms();
      } catch (error) {
        if (error instanceof MissingIdentityError) errorMessage.textContent = 'Netlify Identity is not enabled for this site.';
        else if (error instanceof AuthError && error.status === 401) errorMessage.textContent = 'Invalid email or password.';
        else errorMessage.textContent = error instanceof Error ? error.message : 'Sign-in failed.';
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
