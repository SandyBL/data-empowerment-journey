backend:
  name: git-gateway
  gateway_url: "/.netlify/git/github"
  branch: main

local_backend: true

media_folder: "deploy/assets/images/blog"
public_folder: "/assets/images/blog"

site_url: "https://datagovjourney.com"
display_url: "https://datagovjourney.com"
logo_url: "/assets/images/dg-logo.png"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog_en"
    label: "Blog — English"
    label_singular: "English article"
    folder: "deploy/content/blog/en"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "en/blog/{{slug}}/"
    summary: "{{title}} — {{date}}"
    fields: &blog_fields
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publication date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "select", options: ["Data Governance", "Data Culture", "Data Literacy", "AI Governance", "Data Quality"] }
      - { label: "Summary", name: "summary", widget: "text", hint: "One or two sentences for cards and search results." }
      - { label: "Author", name: "author", widget: "string", default: "Sandy Bradbury" }
      - { label: "Translation key", name: "translation_key", widget: "string", required: false, hint: "Use the same slug in all three language folders to connect hreflang links." }
      - label: "Previous URLs"
        name: "redirect_from"
        widget: "list"
        required: false
        field: { label: "Old slug", name: "slug", widget: "string" }
        hint: "Only needed if you rename a published article. Add the slug it used before (the last part of its old address) so the old link still works instead of returning a 404."
      - label: "Body"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: []

  - name: "blog_es"
    label: "Blog — Español"
    label_singular: "Artículo en español"
    folder: "deploy/content/blog/es"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "es/blog/{{slug}}/"
    summary: "{{title}} — {{date}}"
    fields: *blog_fields

  - name: "blog_pt"
    label: "Blog — Português"
    label_singular: "Artigo em português"
    folder: "deploy/content/blog/pt"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    preview_path: "pt/blog/{{slug}}/"
    summary: "{{title}} — {{date}}"
    fields: *blog_fields
