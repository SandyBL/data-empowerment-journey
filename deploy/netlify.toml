# Netlify configuration.
#
# Build settings intentionally stay in the Netlify UI; this file only adds
# response headers. Crawl directives live here (rather than in robots.txt) so
# Google can still fetch these files and read the noindex instruction — a
# robots.txt Disallow would hide the directive and leave the URLs indexable.

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Print/export templates and raw Markdown sources are implementation details,
# not pages people should land on from search.
[[headers]]
  for = "/assets/templates/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/playbooks/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"
