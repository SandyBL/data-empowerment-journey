# Netlify configuration.
#
# Crawl directives live here (rather than in robots.txt) so Google can still
# fetch these files and read the noindex instruction — a robots.txt Disallow
# would hide the directive and leave the URLs indexable.

# The build command generates the homepages, article pages, confession walls,
# sitemap.xml, the llms.txt pair and _redirects (see
# scripts/generate-blog-index.mjs). That output is NOT committed — it is listed
# in .gitignore — so the generator is the single source of truth and the
# repository can never disagree with what the site serves. A missing or broken
# command therefore fails the deploy outright rather than quietly shipping a
# stale copy, which is the behaviour we want: Netlify keeps the previous deploy
# live and the failure is visible. The command is versioned here rather than
# kept in the UI, where a change leaves no history and can't be tested on a
# deploy preview.
#
# Paths below are relative to the base directory. Base itself stays in the UI
# (currently "deploy") because Netlify must resolve it before it can find this
# file; publish = "." therefore means deploy/, which is where the generator
# writes in place. Because the publish directory is the repository, the
# [[redirects]] block further down 404s the source files that would otherwise
# be downloadable.
[build]
  command = "npm run build"
  publish = "."

# Everything in the publish directory is a public URL, and publish = "." means
# the publish directory is the repository: without these rules the build
# pipeline, the serverless function sources, the database schema, the raw
# Markdown behind every article and the dependency lockfiles are all fetchable
# by anyone who guesses the path. The X-Robots-Tag headers below keep those
# paths out of search results, but noindex governs indexing, not access.
#
# 404 rather than 403: a "forbidden" reply confirms the file is there. force =
# true because a static file at the same path would otherwise win.
#
# Deliberately NOT blocked: /admin/config.yml, which the Decap CMS browser app
# fetches over HTTP and cannot start without, and /assets/templates/*, which
# the PDF report generator fetches at download time.
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/404.html"
  status = 404
  force = true

# Function source and the SQL migration history. The functions themselves are
# served by Netlify at the paths their Config exports declare (/api/...), not
# from this directory, so nothing routable is affected.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/deno.lock"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/drizzle.config.ts"
  to = "/404.html"
  status = 404
  force = true

# Private company spaces. /w/<slug>/ is the address a facilitator hands to a
# room, and it is served by the single page at /workspace/index.html, which
# reads the slug back out of the path. A rewrite (status 200) rather than a
# redirect, so the URL in the address bar stays the one that was handed out and
# the page can tell which space it is meant to open.
#
# The slug is not validated here. It cannot be: the list of spaces lives in the
# database, and a rule in this file would have to be edited for every client.
# The page asks /api/workspace/session which space this is, and an unknown slug
# comes back as "we do not recognise this space address" — which is also exactly
# what an expired one has to look like from outside.
[[redirects]]
  from = "/w/*"
  to = "/workspace/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# A client's space is not a public page. The gate itself carries a noindex meta
# tag, but the header covers the /w/ prefix too, where no file exists to carry
# one.
[[headers]]
  for = "/workspace/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/w/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Print/export templates and raw Markdown sources are implementation details,
# not pages people should land on from search.
[[headers]]
  for = "/assets/templates/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# src/ holds the homepage master the build renders into /, /en/ and /pt/. It is
# a template full of placeholders and all three languages at once, so publish =
# "." makes it reachable but it must never compete with the pages built from it.
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The llms.txt convention asks assistants to read these as plain text; without
# the charset the accented Spanish and Portuguese copy arrives mojibaked.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A year of HTTPS-only, covering subdomains. Netlify terminates TLS for every
    # host on this site, so there is nothing here that answers over plain HTTP.
    # Deliberately not submitted to the preload list: preloading is baked into
    # browser binaries and takes months to undo, which is a poor trade for a
    # header that can be set correctly at the edge today.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    # allow-popups rather than same-origin: the Identity widget behind /admin
    # authenticates in a popup window, and the stricter value severs the handle
    # it needs to report back.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Content Security Policy.
    #
    # The site executes code from a handful of third parties (icon fonts, the
    # simulator chart/audio/icon libraries, the Tailwind Play compiler on the
    # simulators, and Decap CMS behind /admin). Every one of those URLs is now
    # version-pinned and carries an integrity hash, but SRI only proves that a
    # file we already asked for was not tampered with — it does nothing about a
    # script tag injected into a page. This is the half that does: an injected
    # <script src="https://attacker.example/x.js"> is not on the allowlist and
    # never executes.
    #
    # 'unsafe-inline' and 'unsafe-eval' are here on purpose rather than by
    # oversight. The simulators are single-file pages built around large inline
    # scripts, the Tailwind Play compiler generates a <style> element at
    # runtime, and Decap CMS evaluates code as it boots. Removing either keyword
    # means rewriting those pages, so the policy states the truth today and the
    # origin allowlist, base-uri, object-src and frame-ancestors still hold.
    # Tighten script-src to a nonce once the inline blocks move to files.
    #
    # form-action 'self': the only form that posts anywhere is the Netlify Forms
    # contact form, which posts to /thank-you on this origin.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net; frame-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The self-hosted woff2 subsets. Their contents never change — a new version of a
# typeface gets a new filename rather than overwriting one of these — so they take
# the immutable year that fonts.gstatic.com used to serve them with. Anything less
# would make self-hosting slower than the third party it replaced.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The per-language search corpora the build writes. They change only when an
# article does, and a stale one silently drops a page from site search, so they
# get the same revalidating hour the CSS and JS use rather than the month the
# images do.
[[headers]]
  for = "/assets/search/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/assets/playbooks/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# The three assets that sit at the root of /assets/ rather than in one of its
# subdirectories. Every Cache-Control rule above is scoped to a subdirectory, so
# these matched none of them and were served with max-age=0 — including
# styles.css, the largest stylesheet on the site, which every page links and
# every navigation therefore revalidated. They take the same revalidating hour
# as the CSS and JS directories.
[[headers]]
  for = "/assets/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/dg-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/dama-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"
