# Netlify configuration.
#
# Crawl directives live here (rather than in robots.txt) so Google can still
# fetch these files and read the noindex instruction — a robots.txt Disallow
# would hide the directive and leave the URLs indexable.

# The build command generates the article pages, sitemap.xml and _redirects
# (see scripts/generate-blog-index.mjs). Because that output is committed, a
# missing or broken command fails silently: the site keeps serving the last
# generated copy while new articles never get a page or a sitemap entry. So the
# command is versioned here rather than kept in the UI, where a change leaves
# no history and can't be tested on a deploy preview.
#
# Paths below are relative to the base directory. Base itself stays in the UI
# (currently "deploy") because Netlify must resolve it before it can find this
# file; publish = "." therefore means deploy/, which is where the generator
# writes in place.
[build]
  command = "npm run build"
  publish = "."

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Print/export templates and raw Markdown sources are implementation details,
# not pages people should land on from search.
[[headers]]
  for = "/assets/templates/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# src/ holds the homepage master the build renders into /, /en/ and /pt/. It is
# a template full of placeholders and all three languages at once, so publish =
# "." makes it reachable but it must never compete with the pages built from it.
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The llms.txt convention asks assistants to read these as plain text; without
# the charset the accented Spanish and Portuguese copy arrives mojibaked.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A year of HTTPS-only, covering subdomains. Netlify terminates TLS for every
    # host on this site, so there is nothing here that answers over plain HTTP.
    # Deliberately not submitted to the preload list: preloading is baked into
    # browser binaries and takes months to undo, which is a poor trade for a
    # header that can be set correctly at the edge today.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    # allow-popups rather than same-origin: the Identity widget behind /admin
    # authenticates in a popup window, and the stricter value severs the handle
    # it needs to report back.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The self-hosted woff2 subsets. Their contents never change — a new version of a
# typeface gets a new filename rather than overwriting one of these — so they take
# the immutable year that fonts.gstatic.com used to serve them with. Anything less
# would make self-hosting slower than the third party it replaced.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The per-language search corpora the build writes. They change only when an
# article does, and a stale one silently drops a page from site search, so they
# get the same revalidating hour the CSS and JS use rather than the month the
# images do.
[[headers]]
  for = "/assets/search/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/assets/playbooks/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"
